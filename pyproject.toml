[project]
name = "velib-realtime-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "juliendlt", email = "juju.delmotte@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "kafka-python>=3.0.11",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
producer = "velib_realtime_analytics.producer.runners.local_runner:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
system-certs = true
